; quartermaster settings (changes apply on next game launch)
[quartermaster]
; master switch: 1 = on, 0 = off
enabled=1
; 1 = write quartermaster.log, 0 = no log file at all
logging=0

[storage]
; which item types the quartermaster keeps (1 = on, 0 = off): rejuvenation potions, gems, runes, essences
rejuv=1
gems=1
runes=1
essences=1
; 1 = .deposit and the deposit key also take items from the stash (the inventory and Horadric Cube are always included), 0 = leave the stash alone
stash=0
; 1 = .deposit, .withdraw and the deposit key only work while you are in a town, 0 = they work anywhere
town_only=1

[keys]
; key that deposits everything switched on above (same as typing .deposit): a name (Insert, Delete, Home, End, PageUp,
; PageDown, F1-F12, a letter or digit), a virtual-key number, or none
deposit=Insert

[cheats]
; 1 = allow .spawn CODE / .spawn unique NAME / .spawn set NAME (creates items out of nothing), 0 = off
spawn=0
