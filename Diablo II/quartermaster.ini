; quartermaster settings (changes apply on next game launch)
[quartermaster]
; master switch: 1 = on, 0 = off
enabled=1
; 1 = write quartermaster.log, 0 = no log file at all
logging=0

[storage]
; which item types the quartermaster keeps (1 = on, 0 = off): rejuvenation potions, gems, runes, essences, keys (the three Pandemonium keys), organs (Diablo's Horn, Baal's Eye, Mephisto's Brain; off by default), shards (Worldstone Shard)
rejuv=1
gems=1
runes=1
essences=1
keys=1
organs=0
shards=1
; 1 = .deposit and the deposit key also take items from the stash, but only while the stash window is open (the inventory and Horadric Cube are always included), 0 = leave the stash alone
stash=1
; 1 = .deposit, .withdraw and the deposit key only work while you are in a town, 0 = they work anywhere
town_only=1

[keys]
; key that deposits everything switched on above (same as typing .deposit): a name (Insert, Delete, Home, End, PageUp,
; PageDown, F1-F12, a letter or digit), a virtual-key number, or none
deposit=Insert
; key that organizes the shared stash page you are looking at (same as typing .organize; only while the stash is open; needs [organize] enabled=1): a name, a virtual-key number, or none
organize=Delete

[grail]
; Holy Grail tracker (quartermaster_grail.txt, shared by every character): 1 = track every unique and set item you find, 0 = off
enabled=1

[organize]
; stash organizer for PlugY's shared stash (the page rules are in quartermaster_organize.cfg): master switch, 1 = on, 0 = off
enabled=1
; 1 = every time a character loads, the items on the in-box pages are sorted into their pages (needs enabled=1)
auto=0
; 1 = after every .organize / .organize scan, everything in the outbox pages is sold for its vendor price (the same as typing .organize sell). Items are destroyed: leave it 0 unless you mean it
autosell=0
; the vendor (NPC class id) whose price list a sale uses: 154 = Charsi
sell_vendor=154

[cheats]
; 1 = allow .spawn CODE [COUNT] [nmag|mag|unique|set] (creates items out of nothing), 0 = off
spawn=0
