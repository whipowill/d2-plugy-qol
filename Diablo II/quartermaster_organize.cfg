# quartermaster_organize.cfg  -  DRAFT for review (nothing reads this file yet)
#
# How to read this file
#   * Lines starting with # are comments.
#   * [group NAME] defines a list of item type codes (from your ItemTypes.txt). A type code also matches its
#     child types, e.g. 'helm' matches pelt, circ and phlm; 'gem' matches all gem colours and grades.
#   * [rule NAME] sends matching items to a page. If several rules match an item, the most specific type wins (see 'Rule ORDER' below).
#       quality   = unique | set | rare | crafted | runeword | magic | normal   (several allowed, any of them)
#       type      = a group name or item type codes
#       pages     = the block of pages this rule fills, e.g. 200-209 (numbered like PlugY's page counter, starting at 1).
#                   Matching items are laid out in 'order' and fill the pages one after another: page 200 first,
#                   and when it is full, 201, and so on. If the block runs out of room, the extra items stay where they are.
#       mode      = sorted | backload | frontload      (default sorted)
#                   sorted   - the whole block is laid out in 'order' every time, so it always stays in order.
#                   backload - for things that can't be put in a meaningful order (charms, jewels): new items go onto the
#                              LAST page of the block that has room (page 69, then 68 ...) and nothing already in the block
#                              is ever moved. You move the good ones to the front pages by hand and the new stuff
#                              keeps landing at the back.
#                   frontload - the same, but new items go onto the FIRST page of the block that has room (page 40, then 41 ...).
#                              Use it for the good ones (e.g. unique rings) while the rest of the same block is backloaded: the two meet in the middle.
#       order     = (sorted mode only) how the items are sorted before filling: clvl (required character level), type, ethereal, sockets, name
#   * Items that match no rule stay where they are.
#   * Rule ORDER: the sections below are in page order. The first rule that matches wins, but the sections never compete (each
#     quality - runeword, unique, set, rare/crafted, normal/superior - and each mats item type belongs to one section). Inside a
#     section the rules are in page order too. When an item fits several type lists, the MOST SPECIFIC type wins (a type that is
#     listed directly beats one that only matches because it is a child type): a throwing axe goes with the knives, not the axes,
#     a javelin with the bows/javelins, not the polearms, and a Necromancer head with the casters, not the shields.

[organize]
inbox       = 10-19        # pages that are emptied into the places below
untouched   = 1-9          # pages the sorter never reads, moves from, or moves onto (your hand-managed pages). A rule whose pages overlap these is reported in chat.
unmatched   = stay         # in-box items that cannot be placed (no rule, or the block is full) stay in the in-box, packed toward its first pages
outbox      = 20-29        # duplicates over the limit (duplicates = best) are moved here, filled from the first page forward
order       = clvl,name    # default layout order inside a page
grid        = auto         # auto = read it from PlugY (PlugY.ini ActiveBigStash, falling back to PlugY/PlugYDefault.ini); you can force a size, e.g. 10x10
packing     = tight        # tight = use every square: items are placed so that no hole is left that a later item could fill
                           # (order is kept as far as the shapes allow) | strict = never skip an item to fill a hole
lookahead   = 25           # tight only: how many items further down the list may be pulled forward to fill a hole on the current page
duplicates  = best         # best = keep the best max_copies of each item that is judged, leave the worse ones where they are for your review
                           # warn = only list them | off = ignore
duplicates_apply = unique set # which qualities are checked for duplicates. Runewords, bases, rares and magic items are never checked.
duplicates_skip = ring amul char jewl gem rune   # item types that are exempt (you may keep many of these): rings, amulets, charms, jewels, gems, runes
duplicates_skip_socketed = 1  # 1 = an item with any sockets (empty or filled) is never judged and never left behind; it also does not count toward max_copies
max_copies  = 3            # how many of the same unique to keep in the sorted pages

# Type groups
[group armor]
type = helm tors

[group small_armor]
type = glov belt boot

[group shields]
type = shld

[group polearms]
type = pole spea

[group swords]
type = swor

[group axes]
type = axe

[group maces]
type = mace club hamm scep

[group knives]
type = knif tkni taxe

[group ranged]
type = bow xbow jave

[group casters]
type = staf wand orb head

# 'polearms' also takes spears (the guide does not mention them). 'ranged' includes javelins. 'casters' = staves, wands,
# orbs and Necromancer heads. Scepters go with the maces.

# ----------------------------------------------------------------------------------------------------
# 1-99  Mats (quality does not matter, except quivers)
# ----------------------------------------------------------------------------------------------------
[rule Jewels]
type = jewl
pages = 30-39
mode = backload

[rule Rings (Unique)]            # listed before [rule Rings] on purpose: with equal types the first rule in the file wins
quality = unique
type = ring
pages = 40-49
mode = frontload

[rule Rings]
type = ring
pages = 40-49
mode = backload

[rule Amulets (Unique)]
quality = unique
type = amul
pages = 50-59
mode = frontload

[rule Amulets]
type = amul
pages = 50-59
mode = backload

[rule Charms (Small)]
type = scha
pages = 60-69
mode = backload

[rule Charms (Large)]
type = mcha
pages = 70-79
mode = backload

[rule Charms (Grand)]
type = lcha
pages = 80-89
mode = backload

[rule Quivers]
quality = magic rare crafted unique set
type = bowq xboq
pages = 90-99
mode = backload

