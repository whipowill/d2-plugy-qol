# ----------------------------------------------------------------------------------------------------
# Bases for runewords share the runeword blocks above: the finished runewords fill the block from its FIRST page forward,
# the bases (white and superior items, with or without sockets yet - you Larzuk them later) are BACKLOADED from its LAST page
# backward, so the two meet in the middle. If a block fills up, the sorter says so in chat and the extras stay where they are.
# ----------------------------------------------------------------------------------------------------
