; qol settings (changes apply on next game launch)
[qol]
; master switch for everything: 1 = on, 0 = off
enabled=1
; 1 = write qol.log (decisions, errors), 0 = no log file at all
logging=0

[pickup]
; potion auto-pickup: 1 = on, 0 = off
enabled=1
; pick up potions within this many tiles of the player
range=4
; how often (milliseconds) to look for items to pick up. Higher = less work per second, slower reaction (20 to 2000)
poll_ms=50
; 1 = pick up every rejuvenation potion even if your belt has no room for it (it goes to your inventory)
rejuv_always=1
; 1 = also pick up gold piles within range
gold=1
; 1 = also pick things up while standing in town (0 = no pickups in town)
pickup_in_town=0

[death]
; 1 = keep your equipment when you die (the "KeepEquip" hex edit by SnakeByteStudios, applied in memory). Single player.
; Off by default.
keep_equipment=1

[experience]
; 1 = no XP penalty for level differences, in either direction: a high-level character still gets full XP from
; low-level monsters, and a low-level character still gets full XP from high-level monsters (e.g. when partied with a
; high-level character). Single player. Off by default.
no_level_penalty=1

[mercenary]
; 1 = mercenaries run when they follow you instead of always walking (fixes a bug in stock LoD 1.13d).
; Off by default. Only does anything on stock LoD 1.13d.
run=1
; 1 = mercenaries can equip a wider range of items: Rogue: bows, crossbows; Desert: polearms, spears (also Amazon),
; javelins; Iron Wolf: shields, 1H swords, wands, scepters, maces, orbs; Barbarian: swords, axes, maces, hammers,
; Barbarian helms; every merc: rings, amulets, boots, gloves, belts. Replaces BaseMod's [MercMod] options: set
; FullEquip=0, RogueCrossBow=0, RogueAmaBow=0 in BaseMod.ini or this stays off. Stock LoD 1.13d only.
equip=1
; 1 = when you hire a replacement mercenary, the old one's equipment is dropped on the ground at your feet instead of being destroyed
; (needs an empty cursor when you hire)
drop_items=1
; 1 = mercenaries can use Whirlwind-type special attacks properly: they start them next to an enemy, spin through the pack like a player's Whirlwind, and zig-zag
; (the game normally cancels these as soon as the enemy is in reach). The skill itself comes from your game data files.
whirlwind=1

[maps]
; 1 = wider hallways in the Maggot Lair and the Arcane Sanctuary (map files from qol.mpq, which must sit next to qol.dll).
; Takes effect for areas generated after the game starts.
wide_halls=1

[cpu]
; 1 = stop the game using 100% of a CPU core while idle (the well-known D2 busy-loop bug): its main loops sleep 1 ms instead of spinning.
; Stock LoD 1.13d only.
fix=1
; 1 = also skip redundant frame drawing when the game is ahead of its 25 fps logic (extra CPU saving; experimental)
throttle_render=0

[clicker]
; hold a key to repeat left mouse clicks at the current cursor position
enabled=1
; virtual-key code of the hold key (32 = spacebar)
key=32
; key must be held this long (milliseconds) before clicking starts (so typing a space does not click)
hold_delay_ms=200
; pause between clicks (milliseconds); 100 = 10 clicks per second
interval_ms=100

[summons]
; Druid: remembers the summons you cast (ravens, wolves, bear, vines, spirits) and recasts them for free when you load into a game.
enabled=1

[respec]
; type .reset stats or .reset skills in the chat box (a leading / works too) to take back all your stat points or all your skill points.
enabled=1
