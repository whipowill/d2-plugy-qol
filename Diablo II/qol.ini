; qol settings (changes apply on next game launch)
[qol]
; master switch for everything: 1 = on, 0 = off
enabled=1
; 1 = write qol.log (decisions, errors), 0 = no log file at all
logging=0

[pickup]
; potion auto-pickup: 1 = on, 0 = off
enabled=1
; pick up potions within this many tiles of the player
range=4
; how often (milliseconds) to look for items to pick up. Higher = less work per second, slower reaction (20 to 2000)
poll_ms=50
; 1 = pick up every rejuvenation potion even if your belt has no room for it (it goes to your inventory)
rejuv_always=1
; 1 = also pick up gold piles within range
gold=1
; 1 = also pick things up while standing in town (0 = no pickups in town)
pickup_in_town=0

[death]
; 1 = keep your equipment when you die (the "KeepEquip" hex edit by SnakeByteStudios, applied in memory). Single player.
; Off by default.
keep_equipment=1

[experience]
; 1 = no XP penalty for level differences, in either direction: a high-level character still gets full XP from
; low-level monsters, and a low-level character still gets full XP from high-level monsters (e.g. when partied with a
; high-level character). Single player. Off by default.
no_level_penalty=1

[combat]
; 1 = the chance to hit can reach 100% instead of stopping at 95% (the 5% minimum is unchanged). It is the game's single hit roll, so monsters hitting you
; can also reach 100%. Stock LoD 1.13d only.
hit_cap_100=1
; 1 = fix the "next hit always misses" bug: after a hit recovery (a monster hits you, a block, a stun) your next attack could do nothing, because the game leaves a stale
; frame value on your character when the attack starts. This repairs that value only in that broken case and leaves normal attacks (and the repeated hits of Fend, Zeal,
; Fury and Strafe) untouched. Applies to every player of a game you host. Stock LoD 1.13d only.
fix_nham=1

[monsters]
; 1 = fix the Nightmare Fire Enchanted death explosion: the game cuts it to 2/3 in Nightmare but to 1/8 in Hell, so
; late-Nightmare monsters explode about twice as hard as Hell ones. This makes Nightmare 1/4, so it grows smoothly
; from Normal into Hell. Normal and Hell are unchanged. Stock LoD 1.13d only.
fire_enchanted_fix=1

[items]
; 1 = quivers and throwing weapons are never used up: arrows and bolts are not subtracted when you shoot, thrown javelins, knives and axes are not subtracted when you throw, and a
; throwing weapon that wears out keeps its whole stack. Applies to every player of a game you host (also on a LAN). Stock LoD 1.13d only.
infinite_ammo=1

[mercenary]
; 1 = mercenaries run when they follow you instead of always walking (fixes a bug in stock LoD 1.13d).
; Off by default. Only does anything on stock LoD 1.13d.
run=1
; 1 = mercenaries can equip a wider range of items: Rogue: bows, crossbows; Desert: polearms, spears (also Amazon),
; javelins; Iron Wolf: shields, 1H swords, wands, scepters, maces, orbs; Barbarian: swords, axes, maces, hammers,
; Barbarian helms; every merc: rings, amulets, boots, gloves, belts. Replaces BaseMod's [MercMod] options: set
; FullEquip=0, RogueCrossBow=0, RogueAmaBow=0 in BaseMod.ini or this stays off. Stock LoD 1.13d only.
equip=1
; 1 = when you hire a replacement mercenary, the old one's equipment is dropped on the ground at your feet instead of being destroyed
; (needs an empty cursor when you hire). A dead mercenary's equipment is dropped too.
drop_items=1
; 1 = mercenaries can use Whirlwind-type special attacks properly: they start them next to an enemy, spin through the pack like a player's Whirlwind, and zig-zag
; (the game normally cancels these as soon as the enemy is in reach). The skill itself comes from your game data files.
whirlwind=1

[glow]
; 1 = players get the glowing aura the game shows for a full set of Tal Rasha, Immortal King and the like (cosmetic, no bonuses). Applies to every player of a game you host (also on a LAN). Stock LoD 1.13d only.
enabled=1
; only characters of this level or higher get it (included). 1 = no level needed
min_level=1
; 1 = only characters that have beaten Baal in Hell (the quest data of their save) get the glow; 0 = every character of that level.
hell_baal_required=1

[maps]
; 1 = wider hallways in the Maggot Lair and the Arcane Sanctuary (map files from qol.mpq, which must sit next to qol.dll).
; Takes effect for areas generated after the game starts.
wide_halls=1

[cpu]
; 1 = stop the game using 100% of a CPU core while idle (the well-known D2 busy-loop bug): its main loops sleep 1 ms instead of spinning.
; Stock LoD 1.13d only.
fix=1
; 1 = also skip redundant frame drawing when the game is ahead of its 25 fps logic (extra CPU saving; experimental)
throttle_render=0

[clicker]
; hold a key to repeat left mouse clicks at the current cursor position
enabled=1
; virtual-key code of the hold key (32 = spacebar)
key=32
; key must be held this long (milliseconds) before clicking starts (so typing a space does not click)
hold_delay_ms=200
; pause between clicks (milliseconds); 100 = 10 clicks per second
interval_ms=100

[summons]
; Druid: remembers the summons you cast (ravens, wolves, bear, vines, spirits) and recasts them for free when you load into a game.
enabled=1

[respec]
; type .reset stats or .reset skills in the chat box (a leading / works too) to take back all your stat points or all your skill points.
enabled=1

[dclone]
; Diablo Clone (the MonStats row "diabloclone"): at random while you play the game announces him ("Diablo Walks the Earth") and the next super unique it creates
; (Bishibosh, Rakanishu and so on) is replaced by him, as in the original event; his stats come from the Normal / Nightmare / Hell columns of that row.
; enabled=1 also turns on the chat commands .dclone (starts the event now: announcement, then he replaces the next super unique) and .dclone now (spawns him next to you; not in a town).
enabled=1
; 1 = send the game's "Diablo Walks the Earth" announcement to every player when the event starts
announce=1
; a clock starts when a game loads; every roll_minutes (0.1-600, decimals allowed) the game rolls the dice once: chance_per_roll percent (0-100, decimals allowed, for example 0.25) that the event starts.
; It can happen more than once in a game. 10 minutes at 5% is roughly one event every three hours of play. chance_per_roll=0 means only the chat command.
roll_minutes=10
chance_per_roll=5
; which difficulties he may appear in (1 = yes)
normal=1
nightmare=1
hell=1
; NOTE: this mod only decides WHEN he appears. How hard he is (level, HP, resistances, damage) is not controlled here: it comes from the "diabloclone" row of the game's
; Data\global\excel\MonStats.txt (separate Normal / Nightmare / Hell columns), so change his difficulty by editing that TXT file.

[terrorzone]
; A "Terror Zone": one zone is picked at random and lasts rotate_minutes. Any area with monsters can be picked (not towns, not the five act-boss rooms). Areas with the same name in the same
; act count as one zone (Tal Rasha's seven tombs): the boosts apply to all of them. It is announced in purple in the chat (with the name the game shows for the area), and it gets the boosts below
; while it is the zone. The game's own screens (waypoint list, arrival banner) are not marked: finding the zone is part of the game.
; A new zone is picked every time you enter a game, and nothing is saved to disk: closing the game forgets it. The zone only changes inside a game when rotate_minutes run out.
enabled=1
; how long a zone lasts, in minutes (1-1440), counted from the moment it was picked (also while the game is closed). 60 = one hour.
rotate_minutes=60
; 1 = Terror Zones only exist in Hell (as in D2R); 0 = in every difficulty
hell_only=0
; 1 = only areas that have a waypoint can be picked (34); 0 = any area with monsters (about 120 zones)
waypoint_areas_only=0

; ---- Area level (levels, not percent). Monsters are created at the area level and their drops take it as item level; it is the number the map overlay shows. ----
; level_bonus is added to the area's normal level in every difficulty. In Hell only, the result is raised to at least hell_min_level (0 = off) and limited to hell_max_level
; (item level tops out at 99; the game's monster level table goes to 110). Normal and Nightmare get only level_bonus (and the 99 ceiling).
level_bonus=10
hell_min_level=85
hell_max_level=99

; ---- Boosts, in percent (50 = 50% more; 0 = off) ----
; more monsters in the zone
density_pct=100
; more champion and unique packs (at least 1)
elite_pct=100
; more experience from kills in the zone
xp_pct=100
; more gold picked up in the zone
gold_pct=100
; better chance of magic, rare, set and unique drops in the zone: your own magic find is raised by this percent (100 = doubled: 401 becomes 802). Only the player in the zone gets it, and it is never saved.
magic_find_pct=100
; Area level, density and elite packs only reach areas created after the zone starts (an area you are already standing in keeps what it has).
