[qol_ui]
; 0 = turn everything in qol_ui.dll off
enabled=1
; 1 = write qol_ui.log (off by default; turn it on to see what the DLL is doing, e.g. if a feature does not appear)
logging=0

[lootfilter]
; 1 = item names on the ground and in tooltips follow the ItemDisplay rules in qol_ui_filter.cfg (put it next to the game).
; Stock LoD 1.13d only. Nothing here can be changed in game.
enabled=1
; the filter level at start (0-3); the + / - keys change it in game. Rules test it with FILTLVL
; (with remember_filter_level=1 the keys write the new level back into this line, so it is the same next game)
filter_level=1
; 1 = remember the filter level you set with the + / - keys: it is saved into filter_level above
remember_filter_level=1
; 1 = items the rules block (an ignore rule matches, no map rule, no whitelist) are taken out of the game as soon as they appear on the ground,
; as BH does: no sprite, no label, not clickable. They can flash for a tenth of a second. 0 = leave them (they are only tagged "[blocked]")
hide_blocked=1
; 1 = gold piles on the ground show their amount as the label (the game's own behaviour); 0 = the label is blank (the pile stays, you still pick it up)
show_gold_amount=0
; 1 = items whose rules have map colours (%MAP% %DOT-xx% %PX-xx% border, line) get those boxes / dots / lines on the automap
map_dots=1
; chat alerts for items that drop (rules with a map action: %MAP% %DOT-xx% %TIER-n% ...). %NOTIFY-DEAD% silences an item.
alerts=1
; 1 = also alert for items already on the ground when you arrive (BH "Item Close Notifications")
alert_close=1
; a rule with %TIER-n% alerts only when n <= ping_level (rules without a tier always alert)
ping_level=5

[features]
; 1 = Shift + left click an unidentified item (inventory, stash, cube) to identify it with the Tome of Identify in your inventory
shift_click_id=1
; 1 = Shift + right click an item to move it between the inventory and the open stash; Ctrl + right click drops it on the ground
item_move=1

; 1 = ground item labels are always shown, without holding Alt (BH "Always Show Items"); this is the state at start, the show_items_key below toggles it
always_show_items=0

; 1 = show the possible range next to each magical property of an item ("+25% Faster Cast Rate [20 - 30]"): unique, set, runeword, magic, rare and crafted items
; (BH "Always Show Item Stat Ranges"). 0 = only while Ctrl is held. Damage lines and a base-defense range are not covered yet.
item_stat_ranges=1
; the colour of the range text (game text colour number 0-15; BH uses 10 = dark green)
stat_range_color=10

[keys]
; Windows virtual-key numbers (decimal), 0 = unbound. Ignored while a chat box is open.
; inspect: with the mouse on another player, or on your Iron Golem / Valkyrie / Shadow Master, show THAT unit's gear in the inventory panel (73 = I, 0 = off). The
; inventory key is not blocked, so it still opens / closes the inventory as usual
inspect_key=73
; character stats panel (resistances, AR/defense, rates, damage ...): toggles it, Esc closes it (66 = B). It shows your mercenary while the mercenary inventory is open
stats_key=66
; optional: flips the panel between you and your mercenary (0 = unbound, e.g. 77 = M)
stats_merc_key=0
; toggle always showing the ground item labels (76 = L, 0 = off). Needs always_show_items=1 or a key to be active
show_items_key=76
; type .reload in chat to re-read qol_ui.ini and qol_ui_filter.cfg without restarting (the word after the dot; empty = no chat command)
reload_command=reload
; raise / lower the filter level (what rules see as FILTLVL: 0 none, 1 minimal, 2 moderate, 3 aggressive): 187 = + (=) key, 189 = - key, 107 / 109 = numpad + / -
filter_up_key=187
filter_down_key=189
filter_up_key2=107
filter_down_key2=109

[display]
; 1 = the stats panel sits on the right of the screen, 0 = on the left
stats_on_right=1
; 1 = a clock in the top-right corner while the automap is closed
clock=1
; 1 = 24-hour clock, 0 = 12-hour (no AM/PM shown)
clock_24h=0
; text colour (game text colour number: 0 white, 1 red, 2 green, 3 blue, 4 gold, 5 grey, 8 orange, 9 yellow ...)
clock_color=4
; 1 = buff / aura / debuff icons along the bottom of the screen (blue = yours, red = against you; hover for the name). The pictures come from qol_ui.mpq
; next to the game (BH's icons plus Druid ones); without it a small box with two letters is drawn for each state
buffs=1
; extra pixels to raise the icons, on top of BH's 49 pixels above the bottom edge (which clears the belt / hotbar). 0 = BH's position;
; negative moves them down (-49 = the very bottom). Buffs and debuffs both use it
buff_bottom=5
; extra pixels to move the icons in from the sides, on top of BH's 117 pixels: buffs move right, debuffs move left. 0 = BH's position; negative moves them outward
buff_side=0
; pixels between the icons (0-32)
buff_spacing=5
; the game's colour-shift number the pictures are drawn with: buff_tint for your buffs and auras, debuff_tint for debuffs against you (BH uses 3 = blue, 1 = red).
; Try other numbers (0-255) to change the hue; 0 normally means no shift. Boxes (states without a picture) are not affected.
buff_tint=3
debuff_tint=1
; 1 = with the automap open, show the area name, difficulty and area level in the top-right corner
map_info=1
map_info_color=4

[automap]
; 1 = draw lines on the automap from you to the things BH's AutoTele points at (stock 1.13d only). Each kind has a palette colour index (0-255) used
; for its line and for a small square on the destination; -1 turns that kind off. The destinations are looked up once when you enter a level, for the
; whole level whether explored or not. 
exit_lines=1
; the next area (BH "Next Color")
next_color=10
; the other thing of the area: a quest object, boss, shrine ... (BH "Other Color")
other_color=13
; the waypoint (BH "WP Color")
wp_color=154
; the way back to the previous area (BH "Prev Color")
prev_color=5
; a second exit in some areas, e.g. Cold Plains: Burial Grounds and the cave (BH "Other Extra Color")
extra_color=24
; The crosses the game draws on the map (a palette colour index, 0-255; -1 = leave the game's own colour):
; the cross on town and red portals
portal_cross_color=158
; your own cross
me_cross_color=32
; the cross of units you own: your mercenary AND your other minions (the game uses one colour for all of them, so they cannot be told apart)
minion_cross_color=29
; town NPC crosses
npc_cross_color=13
; other players in YOUR party
team_cross_color=125
; other players NOT in your party.
; The game uses this entry for your minions too while you are not in a party, so minion_cross_color and other_player_cross_color only differ for real if you are in a party
other_player_cross_color=10
; the MINIONS of players in your party.
; The game draws these only while its automap "show party" option is on. Minions of players NOT in your party get no cross from the game at all
team_minion_cross_color=120
; Name labels on the map. A palette colour index like the crosses above (the game's text only has about a dozen colours, so the NEAREST one is used;
; several palette colours can land on the same text colour), or t and a number to choose the text colour itself:
; t0 white, t1 red, t2 green, t3 blue, t4 gold, t5 grey, t7 tan, t8 orange, t9 yellow, t10 dark green, t11 purple. -1 = leave the game's colour
npc_label_color=t4
team_label_color=t2
other_player_label_color=t1
